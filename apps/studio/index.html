<!doctype html>
<html lang="en" data-theme="light" data-palette="blue" data-density="comfortable" data-kit="default">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A framework-independent design system workspace.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="studio-version" content="__STUDIO_VERSION__">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>PWA Design System Studio</title>
    <script src="/theme-init.js"></script>
    <script src="/token-prepaint.js"></script>
  </head>
  <body>
    <a class="studio-skip" href="#main">Skip to content</a>
    <div class="studio-layout">
      <aside id="desktop-sidebar" class="studio-sidebar" aria-label="Studio sidebar">
        <a class="studio-brand" href="#overview"><span class="studio-brand-mark" aria-hidden="true">P</span><span><strong>PWA Design System</strong><small>STUDIO</small></span></a>
        <nav class="studio-nav" aria-label="Studio navigation" data-studio-nav></nav>
        <div class="studio-sidebar-foot"><span>DESIGN SYSTEM</span><strong>Foundation / v0.1</strong></div>
      </aside>
      <div class="studio-content">
        <header class="studio-topbar">
          <div class="studio-topbar-context">
            <button type="button" class="studio-menu-button" id="open-navigation" aria-label="Open navigation" aria-haspopup="dialog" aria-controls="mobile-navigation"><span aria-hidden="true">☰</span></button>
            <div class="studio-breadcrumb"><span>Studio</span><span aria-hidden="true">/</span><strong id="current-page">Overview</strong></div>
          </div>
          <div class="studio-topbar-actions"><button type="button" class="studio-sidebar-toggle" id="toggle-sidebar" aria-controls="desktop-sidebar" aria-expanded="true">Collapse sidebar</button><label class="studio-theme-label" for="theme-select">Theme</label><span class="studio-select-wrap"><select id="theme-select" class="studio-select" name="theme" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></span></div>
        </header>
        <p id="preference-status" class="studio-preference-status" role="status"></p>
        <section id="pwa-update" hidden aria-label="Application update"><p role="status"></p><button type="button">Prepare update</button></section>
        <main id="main" class="studio-main" tabindex="-1"><p>Loading workspace…</p></main>
      </div>
    </div>
    <dialog id="mobile-navigation" class="studio-drawer" aria-labelledby="mobile-navigation-title">
      <div class="studio-drawer-header"><div><span class="studio-eyebrow">WORKSPACE</span><h2 id="mobile-navigation-title">Navigation</h2></div><button id="close-navigation" type="button" class="studio-close-button" aria-label="Close navigation">×</button></div>
      <nav class="studio-nav studio-drawer-nav" aria-label="Mobile navigation" data-studio-nav></nav>
    </dialog>
    <p id="route-announcement" class="studio-sr-only" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
